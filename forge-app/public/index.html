<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xen Forge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="app-brand-wrap" href="#/" aria-label="Xen Forge, vue générale">
        <span class="app-logo" aria-hidden="true">
          <svg viewBox="3 3 26 26">
            <g transform="translate(0 -0.5)" stroke-width=".7" stroke-linejoin="round">
              <path class="anvil-top" d="M4 8.5H27Q27.8 8.5 27.8 9.3V11.8Q27.8 12.6 27 12.6H11.5C8.5 12.6 5.8 11 4 8.5Z"></path>
              <path class="anvil-mid" d="M12.6 13.6H23.4Q21.4 15.8 21.6 18.3H14.4Q14.6 15.8 12.6 13.6Z"></path>
              <path class="anvil-base" d="M14.4 19.3H21.6Q22 21.6 25.5 22.4V23.8Q25.5 24.5 24.8 24.5H11.2Q10.5 24.5 10.5 23.8V22.4Q14 21.6 14.4 19.3Z"></path>
            </g>
          </svg>
        </span>
        <span class="brand">Xen Forge</span>
      </a>
      <div class="header-actions">
        <button type="button" class="header-icon-btn" id="theme-toggle">
          <svg class="icon-system" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
            <path d="M8 20h8M12 16v4"></path>
          </svg>
          <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
          </svg>
          <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
        <div class="user-menu" id="user-menu">
          <button type="button" class="avatar" id="user-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-list">
            <span id="user-initial" aria-hidden="true"></span>
          </button>
          <div class="user-dropdown" id="user-menu-list" role="menu" aria-labelledby="user-menu-btn" hidden>
            <div class="user-card">
              <span class="avatar avatar-lg" aria-hidden="true"><span id="user-initial-lg"></span></span>
              <span class="user-card-text">
                <span class="user-card-name" id="session-name"></span>
                <span class="user-card-status">Session active</span>
              </span>
            </div>
            <button type="button" class="user-menu-item danger" id="logout-btn" role="menuitem">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3M16 16l4-4-4-4M20 12H10"></path>
              </svg>
              Déconnexion
            </button>
            <div class="app-version" id="app-version"></div>
          </div>
        </div>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <nav class="menu" aria-label="Navigation principale">
          <button type="button" class="nav-item" data-route="/">Vue générale</button>
          <details open class="nav-packer">
            <summary>Packer</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/packer/profiles">Profils</button>
              <button type="button" class="nav-item" data-route="/packer/history">Historique</button>
              <button type="button" class="nav-item" data-route="/packer/schedules">Planification</button>
              <button type="button" class="nav-item" data-route="/packer/distributions">Distributions</button>
            </div>
          </details>
          <details open class="nav-tofu">
            <summary>OpenTofu</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/tofu/profiles">Profils</button>
              <button type="button" class="nav-item" data-route="/tofu/history">Historique</button>
              <button type="button" class="nav-item" data-route="/tofu/schedules">Planification</button>
            </div>
          </details>
          <details open class="nav-ansible">
            <summary>Ansible</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/ansible/profiles">Profils</button>
              <button type="button" class="nav-item" data-route="/ansible/history">Historique</button>
              <button type="button" class="nav-item" data-route="/ansible/catalogue">Catalogue</button>
              <button type="button" class="nav-item" data-route="/ansible/schedules">Planification</button>
            </div>
          </details>
          <details open class="nav-secrets">
            <summary>Sécurité</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/safe">Coffre-fort</button>
              <button type="button" class="nav-item" data-route="/certificates">Certificats</button>
              <button type="button" class="nav-item" data-route="/audit">Audit</button>
            </div>
          </details>
          <details open class="nav-auth">
            <summary>Authentification</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/users">Administrateurs</button>
              <button type="button" class="nav-item" data-route="/domain">Domaine (LDAP)</button>
            </div>
          </details>
          <details open class="nav-infrastructure">
            <summary>Infrastructure</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/connectors">Connecteurs</button>
            </div>
          </details>
          <details open class="nav-settings">
            <summary>Paramètres</summary>
            <div class="submenu">
              <button type="button" class="nav-item" data-route="/security">Sécurité</button>
            </div>
          </details>
        </nav>
      </aside>
      <main class="content">
        <section class="panel" id="app"></section>
      </main>
    </div>
  </div>
  <div id="toast-slot" class="status-toast-slot"></div>
  <div id="modal-root"></div>
  <script src="/js/main.js" type="module"></script>
</body>
</html>
