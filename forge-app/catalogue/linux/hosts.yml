name: Entrée du fichier hosts
os: linux
description: Ajoute, remplace ou retire la ligne d'une adresse IP dans /etc/hosts
parameters:
  adresse:
    label: Adresse IP
    type: str
    format: ipv4
    required: true
  noms:
    label: Noms
    help: Nom complet puis alias, ex. db.exemple.lan, db
    type: list
  etat:
    label: Action
    type: str
    choices: [present, absent]
    default: present
tasks:
  - name: Noms valides
    ansible.builtin.assert:
      that: etat == 'absent' or (noms is defined and noms | reject('match', '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$') | list | length == 0)
      fail_msg: "Noms : au moins un nom DNS valide"
      quiet: true
  - name: Ligne de /etc/hosts
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^{{ adresse | regex_escape }}\s'
      line: "{{ (adresse ~ ' ' ~ noms | join(' ')) if etat == 'present' else omit }}"
      state: "{{ etat }}"
